spring.application.name=MiniFaceBook

## PostgreSQL connection (override with environment variables; defaults = local dev)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/SpringBootDB}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgrespw}

## 'update' keeps your data between restarts ('create' wiped the DB at every start)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

server.port=${PORT:8086}

## Demo users/posts created on first start when the DB is empty
app.seed.enabled=${SEED_DEMO_DATA:true}
