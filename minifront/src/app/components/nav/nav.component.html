<nav class="navbar">
  <a class="brand" routerLink="/feed">Fb<span>Front</span></a>

  <div class="search-wrap">
    <div class="search-box">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input
        type="text"
        placeholder="Search people…"
        [(ngModel)]="searchQuery"
        (input)="onSearch()"
        (blur)="showSearch.set(false)"
        (focus)="searchQuery && showSearch.set(true)"
      />
    </div>
    <div class="search-dropdown" *ngIf="showSearch() && searchResults().length">
      <div
        class="search-result"
        *ngFor="let u of searchResults()"
        (mousedown)="goToProfile(u.id)"
      >
        <img [src]="avatar(u)" [alt]="u.nom" class="avatar-xs" />
        <span>{{ u.nom }}</span>
      </div>
    </div>
  </div>

  <div class="nav-actions">
    <a routerLink="/feed" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>Feed</span>
    </a>
    <a routerLink="/friends" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span>Friends</span>
    </a>
    <a routerLink="/messages" routerLinkActive="active" class="nav-link">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
      <span>Messages</span>
    </a>

    <button class="notif-btn" (click)="toggleNotifs()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="badge" *ngIf="pendingRequests().length">{{ pendingRequests().length }}</span>
    </button>

    <div class="notif-panel" *ngIf="showNotifs()">
      <div class="notif-title">Friend requests</div>
      <div class="notif-empty" *ngIf="!pendingRequests().length">No pending requests</div>
      <div class="notif-item" *ngFor="let req of pendingRequests()">
        <img [src]="avatar(req.userSender)" class="avatar-xs" [alt]="req.userSender.nom" />
        <span class="notif-name">{{ req.userSender.nom }}</span>
        <button class="btn-accept" (click)="acceptRequest(req)">Accept</button>
        <button class="btn-refuse" (click)="refuseRequest(req)">Refuse</button>
      </div>
    </div>

    <a [routerLink]="['/profile', auth.currentUser()?.id]" class="profile-link">
      <img [src]="avatar(auth.currentUser()!)" [alt]="auth.currentUser()?.nom" class="avatar-sm" />
    </a>

    <button class="logout-btn" (click)="logout()" title="Logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>
</nav>
